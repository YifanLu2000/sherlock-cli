[connection]
name = "Marlowe"
resource = "marlowe"
domain_name = "login.marlowe.stanford.edu"
forward_username = "luyifan"
email = "luyifan@stanford.edu"
machine_prefix = "ml"
default_notebook_dir = "/projects/m000134/LuYifan"
remote_util_dir = "~/forward-util"
use_kerberos = false
ssh_host = "marlowe"
shell_init = "module load slurm 2>/dev/null || true"

[state]
path = "~/.local/state/sherlock-cli/marlowe-state.json"

[watch]
poll_interval_seconds = 5
startup_timeout_seconds = 300

[remote]
login_alias = "marlowe"
login_host = "login.marlowe.stanford.edu"
compute_host_alias = "marlowe-compute"
workspace_dir = "~/.cursor-remote/marlowe"
shell_init = "source /etc/profile >/dev/null 2>&1 || true; module load slurm >/dev/null 2>&1 || true"

[[presets]]
id = "marlowe-batch-gpu"
label = "Marlowe Batch GPU"
job_name = "marlowe-GPU-jupyterlab"
sbatch_script = "sbatches/Marlowe-GPU-jupyterlab.sbatch"
partition = "batch"
account = "marlowe-m000134-pm05"
cpus = 8
gpus = 1
mem = "256G"
time = "48:00:00"
port = 56810
isolated_compute_node = false

[[presets]]
id = "marlowe-batch-cpu"
label = "Marlowe Batch CPU"
job_name = "marlowe-CPU-jupyterlab"
sbatch_script = "sbatches/Marlowe-CPU-jupyterlab.sbatch"
partition = "batch"
account = "marlowe-m000134-pm05"
cpus = 8
mem = "256G"
time = "48:00:00"
port = 56811
isolated_compute_node = false
